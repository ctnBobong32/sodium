# 用于构建外部拉取请求
# 我们不希望发布构建产物或将其他缓存暴露给可能不受信任的代码
name: 构建-拉取请求

on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 提取当前分支名称
        shell: bash
        # bash 模式扩展，获取不带斜杠的分支名
        run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> $GITHUB_OUTPUT
        id: ref

      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: 执行 Gradle 构建
        run: ./gradlew build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sodium-构建产物-${{ steps.ref.outputs.branch }}
          path: build/mods/*.jar